[project]
name = "receptenapp-api"
version = "0.1.0"
description = "Receptenapp API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.14.2",
    "sqlalchemy>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.18.5",
    "pyjwt[crypto]>=2.13.0",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "receptenapp"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Depends(...) in defaults is FastAPI's documented DI pattern

[tool.mypy]
python_version = "3.12"
strict = false

[[tool.mypy.overrides]]
module = "receptenapp.services.*"
strict = true

[[tool.mypy.overrides]]
module = "receptenapp.providers.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# One event loop for the whole run: the DB engine in db/session.py is a
# module-level singleton, and its pooled connections must not outlive the
# event loop they were opened on.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
